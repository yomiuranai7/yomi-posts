name: 毎朝の投稿

on:
  schedule:
    - cron: "17 22 * * *"   # 日本時間 7:17（UTC 22:17）。正時は混むので17分にずらす
  workflow_dispatch:
    inputs:
      post_date:
        description: "投稿する日（YYYY-MM-DD）。空なら今日"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 投稿する（DRY_RUN が 0 でなければ表示だけ）
        env:
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 scripts/post.py

      - name: 記録をコミットする
        if: always()
        run: |
          if [ -n "$(git status --porcelain posted.log)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted.log
            git commit -m "投稿の記録 $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
